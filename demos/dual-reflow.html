<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual Reflow — pretext + pre-vert-text</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');

    * { box-sizing: border-box; margin: 0; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #0a0a0f;
      cursor: none;
    }

    #stage { position: relative; width: 100%; height: 100%; }

    /* Horizontal English lines */
    .en-line {
      position: absolute; white-space: pre; pointer-events: none;
      font-family: "Libre Baskerville", Georgia, serif;
      transition: color 0.6s ease, opacity 0.6s ease;
    }

    /* Vertical Japanese column segments */
    .ja-seg {
      position: absolute; pointer-events: none;
      writing-mode: vertical-rl; text-orientation: mixed;
      white-space: nowrap; overflow: hidden;
      font-family: "Noto Sans JP", sans-serif;
      transition: color 0.6s ease, opacity 0.6s ease;
    }

    /* Cursor glow */
    #cursor-glow {
      position: fixed; pointer-events: none; z-index: 100;
      width: 240px; height: 240px; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(200,170,100,0.25) 0%, rgba(200,170,100,0.08) 40%, transparent 70%);
      will-change: left, top;
    }

    .hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      font: 400 12px/1 "Helvetica Neue", sans-serif;
      color: rgba(255,255,255,0.15); z-index: 100;
      background: rgba(0,0,0,0.4); padding: 8px 18px; border-radius: 999px;
      pointer-events: none; white-space: nowrap;
      transition: opacity 0.5s;
    }

    .stats {
      position: fixed; top: 12px; right: 16px;
      font: 400 10px/1.4 "Helvetica Neue", sans-serif;
      color: rgba(255,255,255,0.12); z-index: 100;
      pointer-events: none; text-align: right;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="cursor-glow"></div>
  <div class="hint">Move mouse to reflow text · Click to swap languages</div>
  <div class="stats" id="stats"></div>

  <script type="module" src="./dual-reflow.js"></script>
</body>
</html>
