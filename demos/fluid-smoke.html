<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Smoke — verticalLayout Demo (Tategaki)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #06060a; }
    #art {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: row-reverse;
      justify-content: center;
      align-items: stretch;
    }
    .c {
      overflow: hidden;
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic Pro", "Yu Gothic", Georgia, serif;
      font-size: 14px;
      text-align: center;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      white-space: nowrap;
    }
    .w3 { font-weight: 300; } .w5 { font-weight: 500; } .w8 { font-weight: 800; }
    .it { font-style: italic; }
    .a1  { color: rgba(120,180,220,0.08); }
    .a2  { color: rgba(120,180,220,0.16); }
    .a3  { color: rgba(120,180,220,0.24); }
    .a4  { color: rgba(120,180,220,0.32); }
    .a5  { color: rgba(120,180,220,0.42); }
    .a6  { color: rgba(120,180,220,0.54); }
    .a7  { color: rgba(120,180,220,0.66); }
    .a8  { color: rgba(120,180,220,0.78); }
    .a9  { color: rgba(120,180,220,0.90); }
    .a10 { color: rgba(120,180,220,1.0);  }
    #stats {
      position: fixed; bottom: 6px; left: 0; right: 0; text-align: center;
      font: 400 10px/1 "Helvetica Neue", sans-serif; color: rgba(255,255,255,0.10);
      pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="art"></div>
  <div id="stats"></div>

  <script type="module">
    import { prepareVertical, layoutNextColumn, CURSOR_START } from "../dist/index.js";

    // ── Config ──────────────────────────────────────────────────────────────
    const FONT_SIZE   = 14;
    const CELL_H      = FONT_SIZE;          // vertical advance per cell
    const CELL_W      = FONT_SIZE * 1.85;   // column width (matches VERT_COL_WIDTH)
    const FONT_FAMILY = '"Noto Sans JP", "Hiragino Kaku Gothic Pro", "Yu Gothic", Georgia, serif';

    // Character palette — CJK fills the 1em square perfectly; Latin adds texture.
    const CJK_CHARS   = "一二三山川田大小日月火水木金土天地人花鳥風雲雨雪波光影夢幻命魂煙炎霧";
    const LATIN_CHARS = ".,:;!+-*#acemnox";
    const CHARSET     = CJK_CHARS + LATIN_CHARS;
    const WEIGHTS     = [400, 700];
    const FONT_STYLES = ["normal"];

    // ── Brightness estimation ───────────────────────────────────────────────
    const bCvs = document.createElement("canvas");
    bCvs.width = bCvs.height = 28;
    const bCtx = bCvs.getContext("2d", { willReadFrequently: true });

    function estimateBrightness(ch, font) {
      bCtx.clearRect(0, 0, 28, 28);
      bCtx.font = font;
      bCtx.fillStyle = "#fff";
      bCtx.textBaseline = "middle";
      bCtx.fillText(ch, 1, 14);
      const d = bCtx.getImageData(0, 0, 28, 28).data;
      let sum = 0;
      for (let i = 3; i < d.length; i += 4) sum += d[i];
      return sum / (255 * 784);
    }

    // ── Build palette — measure advance height via canvas (fast path) ──────
    // For single-character brightness sampling we skip prepareVertical (which
    // invokes Intl.Segmenter) and measure directly with canvas.  This keeps
    // palette init under 200ms.  prepareVertical is used for real text layout.
    const mCvs = document.createElement("canvas");
    const mCtx = mCvs.getContext("2d");

    function measureAdvH(ch, font) {
      // CJK fullwidth → fontSize.  Latin → canvas horizontal width (= vertical advance when rotated).
      const cp = ch.codePointAt(0) || 0;
      if ((cp >= 0x3000 && cp <= 0x9FFF) || (cp >= 0xFF00 && cp <= 0xFFEF)) return FONT_SIZE;
      mCtx.font = font;
      return mCtx.measureText(ch).width;
    }

    const palette = [];
    for (const style of FONT_STYLES) {
      for (const weight of WEIGHTS) {
        const font = `${style === "italic" ? "italic " : ""}${weight} ${FONT_SIZE}px ${FONT_FAMILY}`;
        for (const ch of CHARSET) {
          if (ch === " ") continue;
          const advH = measureAdvH(ch, font);
          if (advH <= 0) continue;
          palette.push({ char: ch, weight, style, font, advH, brightness: estimateBrightness(ch, font) });
        }
      }
    }
    const maxB = Math.max(...palette.map(p => p.brightness));
    if (maxB > 0) for (const p of palette) p.brightness /= maxB;
    palette.sort((a, b) => a.brightness - b.brightness);

    const aspect  = CELL_W / CELL_H;
    const aspect2 = aspect * aspect;

    // ── Character finder (binary search by brightness) ──────────────────────
    function findBest(targetB) {
      let lo = 0, hi = palette.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (palette[mid].brightness < targetB) lo = mid + 1;
        else hi = mid;
      }
      let bestScore = Infinity, best = palette[lo];
      for (let i = Math.max(0, lo - 10); i < Math.min(palette.length, lo + 10); i++) {
        const p = palette[i];
        const score = Math.abs(p.brightness - targetB);
        if (score < bestScore) { bestScore = score; best = p; }
      }
      return best;
    }

    function esc(c) {
      if (c === "&") return "&amp;";
      if (c === "<") return "&lt;";
      if (c === ">") return "&gt;";
      return c;
    }

    function wCls(w, s) {
      const wc = w === 300 ? "w3" : w === 500 ? "w5" : "w8";
      return s === "italic" ? wc + " it" : wc;
    }

    // ── Grid ────────────────────────────────────────────────────────────────
    const MAX_COLS = 50;
    const MAX_ROWS = 40;
    const artEl   = document.getElementById("art");
    const statsEl = document.getElementById("stats");

    let COLS = 0, ROWS = 0;
    let colEls = [];
    let density, tempDen;

    // Smoke emitters — spread across the viewport for full coverage
    const emitters = [
      { cx: 0.2,  cy: 0.3, orbitR: 0.12, freq: 0.3,  phase: 0,   strength: 0.2  },
      { cx: 0.5,  cy: 0.25,orbitR: 0.1,  freq: 0.25, phase: 2.1, strength: 0.17 },
      { cx: 0.35, cy: 0.6, orbitR: 0.14, freq: 0.35, phase: 4.2, strength: 0.22 },
      { cx: 0.65, cy: 0.5, orbitR: 0.08, freq: 0.4,  phase: 1,   strength: 0.16 },
      { cx: 0.8,  cy: 0.7, orbitR: 0.1,  freq: 0.3,  phase: 3.0, strength: 0.18 },
    ];

    // ── Fluid velocity — biased sideways ────────────────────────────────────
    function getVel(c, r, t) {
      const nx = c / COLS, ny = r / ROWS;
      let vx = Math.sin(ny * 6.28 + t * 0.3) * 2
             + Math.cos((nx + ny) * 12.5 + t * 0.55) * 0.7
             + Math.sin(nx * 25 + ny * 18 + t * 0.8) * 0.25
             - 1.2; // constant leftward drift (sideways smoke)
      let vy = Math.cos(nx * 5 + t * 0.4) * 1.5
             + Math.sin((nx - ny) * 10 + t * 0.4) * 0.8
             + Math.cos(nx * 18 - ny * 25 + t * 0.7) * 0.25;
      vx *= aspect;
      return [vx, vy];
    }

    // ── Simulation step ─────────────────────────────────────────────────────
    function updateSim(t) {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const [vx, vy] = getVel(c, r, t);
          let sx = Math.max(0, Math.min(COLS - 1.001, c - vx));
          let sy = Math.max(0, Math.min(ROWS - 1.001, r - vy));
          const x0 = sx | 0, y0 = sy | 0;
          const x1 = Math.min(x0 + 1, COLS - 1), y1 = Math.min(y0 + 1, ROWS - 1);
          const fx = sx - x0, fy = sy - y0;
          tempDen[r * COLS + c] =
            density[y0 * COLS + x0] * (1 - fx) * (1 - fy) +
            density[y0 * COLS + x1] * fx       * (1 - fy) +
            density[y1 * COLS + x0] * (1 - fx) * fy       +
            density[y1 * COLS + x1] * fx       * fy;
        }
      }
      [density, tempDen] = [tempDen, density];

      for (let r = 1; r < ROWS - 1; r++) {
        for (let c = 1; c < COLS - 1; c++) {
          const i = r * COLS + c;
          const avg = (density[i - 1] + density[i + 1]
                    + (density[i - COLS] + density[i + COLS]) * aspect2) / (2 + 2 * aspect2);
          tempDen[i] = density[i] * 0.92 + avg * 0.08;
        }
      }
      [density, tempDen] = [tempDen, density];

      const spread = 4;
      for (const e of emitters) {
        const ex = (e.cx + Math.cos(t * e.freq + e.phase) * e.orbitR) * COLS;
        const ey = (e.cy + Math.sin(t * e.freq * 0.7 + e.phase) * e.orbitR * 0.8) * ROWS;
        const ec = ex | 0, er = ey | 0;
        for (let dr = -spread; dr <= spread; dr++) {
          for (let dc = -spread; dc <= spread; dc++) {
            const rr = er + dr, cc = ec + dc;
            if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
              const dcScaled = dc / aspect;
              const dist = Math.sqrt(dr * dr + dcScaled * dcScaled);
              const s = Math.max(0, 1 - dist / (spread + 1));
              density[rr * COLS + cc] = Math.min(1, density[rr * COLS + cc] + s * e.strength);
            }
          }
        }
      }
      for (let i = 0; i < COLS * ROWS; i++) density[i] *= 0.984;
    }

    // ── Grid init ───────────────────────────────────────────────────────────
    function initGrid() {
      COLS = Math.min(MAX_COLS, Math.floor(window.innerWidth / CELL_W));
      ROWS = Math.min(MAX_ROWS, Math.floor(window.innerHeight / CELL_H));
      density = new Float32Array(COLS * ROWS);
      tempDen = new Float32Array(COLS * ROWS);
      artEl.innerHTML = "";
      colEls.length = 0;
      for (let c = 0; c < COLS; c++) {
        const div = document.createElement("div");
        div.className = "c";
        div.style.height = "100%";
        div.style.width = CELL_W + "px";
        div.style.flexShrink = "0";
        artEl.appendChild(div);
        colEls.push(div);
      }
    }

    let resizeTimer = 0;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(initGrid, 150);
    });
    initGrid();

    // ── Render loop ─────────────────────────────────────────────────────────
    let fc = 0, lastFps = 0, dispFps = 0;

    function render(now) {
      const t = now / 1000;
      updateSim(t);

      for (let c = 0; c < COLS; c++) {
        let html = "";
        for (let r = 0; r < ROWS; r++) {
          const b = density[r * COLS + c];
          if (b < 0.025) {
            html += "\u3000"; // fullwidth space — occupies 1em in vertical mode
          } else {
            const m = findBest(b);
            const ai = Math.max(1, Math.min(10, Math.round(b * 10)));
            html += `<span class="${wCls(m.weight, m.style)} a${ai}">${esc(m.char)}</span>`;
          }
        }
        colEls[c].innerHTML = html;
      }

      fc++;
      if (now - lastFps > 500) {
        dispFps = Math.round(fc / ((now - lastFps) / 1000));
        fc = 0; lastFps = now;
        statsEl.textContent = `${COLS}\u00d7${ROWS} | ${palette.length} glyphs | ${dispFps} fps | verticalLayout`;
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
